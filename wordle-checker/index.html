<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Was it a Wordle?</title>
  <link rel="stylesheet" href="../assets/atomic-shell.css">
  <script src="../assets/atomic-theme.js"></script>
  <script>
    AtomicTheme.applyBeforePaint({ storageKey: 'wordle-checker-theme', mode: 'dataset' });
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: light;
      --paper: #f5f4ef;
      --ink: #111111;
      --ink-soft: #444444;
      --ink-muted: #8a8a85;
      --rule: #1a1a1a;
      --tile: #ffffff;
      --tile-border: #1a1a1a;
      --tile-empty: #d8d6cf;
      --yes: #538d4e;
      --no: #6b6b66;
      --focus: #2b5fff;
      --display: "GT America Expanded", -apple-system, sans-serif;
      --text: "GT America", -apple-system, sans-serif;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #0e0e0d;
      --ink: #f3f1ea;
      --ink-soft: #cfccc4;
      --ink-muted: #8a8a85;
      --rule: #f3f1ea;
      --tile: transparent;
      --tile-border: #f3f1ea;
      --tile-empty: #3a3a3c;
      --yes: #6aaa64;
      --no: #555555;
    }

    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--text);
      font-weight: 500;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
    }

    a { color: inherit; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Main ----------------------------------------------------------- */

    .main {
      flex: 1;
      width: min(640px, calc(100% - 48px));
      margin: 0 auto;
      padding: 72px 0 64px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
    }

    h1 {
      font-family: var(--display); font-weight: 400;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      line-height: 0.95; letter-spacing: -0.01em;
      text-transform: none;
    }

    .subtitle {
      margin-top: 14px;
      color: var(--ink-muted);
      font-size: 0.95rem;
      max-width: 38ch;
    }

    /* Tiles ---------------------------------------------------------- */

    .tiles {
      display: grid;
      grid-template-columns: repeat(5, 64px);
      gap: 10px;
      margin: 48px 0 0;
    }

    .tile {
      width: 64px; height: 64px;
      display: flex; align-items: center; justify-content: center;
      background: var(--tile);
      border: 2px solid var(--tile-empty);
      font-family: var(--display); font-weight: 400;
      font-size: 2rem;
      color: var(--ink);
      text-transform: uppercase;
      cursor: text;
      transition: border-color 120ms, background 220ms, color 220ms, transform 120ms;
    }
    .tile.filled {
      border-color: var(--tile-border);
      animation: pop 140ms ease-out;
    }
    @keyframes pop {
      from { transform: scale(0.92); }
      to { transform: scale(1); }
    }

    .tile.yes { background: var(--yes); border-color: var(--yes); color: #fff; }
    .tile.no  { background: var(--no);  border-color: var(--no);  color: #fff; }

    /* Hidden input drives the tiles */
    .input-shroud {
      position: absolute;
      width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    .result {
      margin-top: 32px; min-height: 60px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .result-headline {
      font-family: var(--display); font-weight: 400;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      letter-spacing: -0.005em;
    }
    .result-detail {
      color: var(--ink-muted);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }

    .loading { color: var(--ink-muted); font-size: 0.85rem; margin-top: 28px; }
    .error { color: #c93a3a; font-size: 0.85rem; margin-top: 12px; }

    /* Footer --------------------------------------------------------- */

    .foot {
      margin-top: auto;
      padding: 24px 28px;
      border-top: 1px solid var(--rule);
      display: flex; justify-content: space-between; gap: 16px;
      color: var(--ink-muted);
      font-family: var(--text); font-size: 0.72rem;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .foot span:last-child { text-align: right; }

    @media (max-width: 480px) {
      .main { padding: 48px 0 48px; }
      .tiles { grid-template-columns: repeat(5, 54px); gap: 8px; }
      .tile { width: 54px; height: 54px; font-size: 1.5rem; }
      .foot { padding: 18px 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="../" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      All Tools
    </a>
    <span class="tool-title">Wordle Checker</span>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode" title="Switch to dark mode">
      <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/>
        <path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/>
        <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
      </svg>
      <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0 9 7.5A9 9 0 1 1 12 3Z"/>
      </svg>
    </button>
  </div>

  <main class="main">
    <h1>Was it a Wordle?</h1>
    <p class="subtitle">Type a five-letter word and find out if the New York Times has already used it.</p>

    <div class="tiles" id="tiles" role="presentation">
      <div class="tile" data-i="0"></div>
      <div class="tile" data-i="1"></div>
      <div class="tile" data-i="2"></div>
      <div class="tile" data-i="3"></div>
      <div class="tile" data-i="4"></div>
    </div>

    <label class="input-shroud" for="wordInput">Five-letter word</label>
    <input
      id="wordInput"
      class="input-shroud"
      type="text"
      maxlength="5"
      autocomplete="off"
      autocapitalize="characters"
      inputmode="text"
      spellcheck="false"
      disabled
    >

    <div class="result" id="result" aria-live="polite">
      <span class="result-headline" id="resultHeadline"></span>
      <span class="result-detail" id="resultDetail"></span>
    </div>

    <p class="loading" id="loading">Loading…</p>
    <p class="error" id="error"></p>
  </main>

  <footer class="foot">
    <span>Atomic Tools · Wordle Checker</span>
    <span id="footerUpdated">Updated …</span>
  </footer>

  <script>
    const API_BASE = 'https://wordle-checker-api.spidleweb.workers.dev';
    const API_URL = `${API_BASE}/api/check-word`;
    const META_URL = `${API_BASE}/api/meta`;
    const footerUpdated = document.getElementById('footerUpdated');

    const wordInput = document.getElementById('wordInput');
    const result = document.getElementById('result');
    const resultHeadline = document.getElementById('resultHeadline');
    const resultDetail = document.getElementById('resultDetail');
    const loading = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const tiles = document.querySelectorAll('.tile');
    const tilesContainer = document.getElementById('tiles');
    AtomicTheme.bind({
      storageKey: 'wordle-checker-theme',
      mode: 'dataset',
      toggleId: 'themeToggle'
    });

    let checkAbort = null;

    function formatDataDate(iso) {
      const parts = iso.split('-').map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      return date.toLocaleDateString(undefined, {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    async function loadFooterDate() {
      try {
        const response = await fetch(META_URL);
        if (!response.ok) throw new Error(`meta ${response.status}`);
        const data = await response.json();
        const label = data.latestDate ? formatDataDate(data.latestDate) : null;
        footerUpdated.textContent = label ? `Updated ${label}` : 'Updated daily';
      } catch (err) {
        console.warn('Could not load data date:', err);
        footerUpdated.textContent = 'Updated daily';
      }
    }

    function init() {
      loading.style.display = 'none';
      wordInput.disabled = false;
      wordInput.focus();
      loadFooterDate();
    }

    function clearResult() {
      resultHeadline.textContent = '';
      resultDetail.textContent = '';
      tiles.forEach(t => t.classList.remove('yes', 'no'));
    }

    function updateTiles(value) {
      const letters = value.toUpperCase().split('');
      tiles.forEach((tile, i) => {
        const letter = letters[i] || '';
        tile.textContent = letter;
        tile.classList.toggle('filled', !!letter);
      });
    }

    async function checkWord() {
      const word = wordInput.value.toUpperCase().trim();
      if (word.length !== 5) return;

      checkAbort?.abort();
      checkAbort = new AbortController();
      const { signal } = checkAbort;
      errorEl.textContent = '';

      try {
        const response = await fetch(`${API_URL}?word=${encodeURIComponent(word)}`, { signal });
        if (!response.ok) throw new Error(`API error: ${response.status}`);
        const data = await response.json();

        if (data.used) {
          tiles.forEach(t => { t.classList.add('yes'); t.classList.remove('no'); });
          resultHeadline.textContent = 'Yes — already used.';
          resultDetail.textContent = `Wordle #${data.game} · ${data.date}`;
        } else {
          tiles.forEach(t => { t.classList.add('no'); t.classList.remove('yes'); });
          resultHeadline.textContent = 'No — still safe to guess.';
          resultDetail.textContent = 'This word has not been a Wordle answer.';
        }
      } catch (err) {
        if (err.name === 'AbortError') return;
        console.error('Error checking word:', err);
        errorEl.textContent = `Error: ${err.message}`;
      }
    }

    wordInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^a-zA-Z]/g, '').slice(0, 5);
      const len = e.target.value.length;
      updateTiles(e.target.value);
      clearResult();
      checkAbort?.abort();
      if (len === 5) checkWord();
    });

    wordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && wordInput.value.length === 5) checkWord();
    });

    // Clicking tiles focuses the hidden input so the keyboard opens on mobile.
    tilesContainer.addEventListener('click', () => wordInput.focus());

    init();
  </script>
</body>
</html>
