<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://spidleweb.net" crossorigin>
  <meta name="robots" content="noindex">
  <title>Nothing · Atomic Tools</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/atomic-shell.css">
  <script src="../assets/atomic-theme.js"></script>
  <script>
    AtomicTheme.applyBeforePaint({ mode: 'dataset' });
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      color-scheme: light;
      --paper: #f5f4ef;
      --ink: #111111;
      --ink-soft: #444444;
      --ink-muted: #66665f;
      --rule: #1a1a1a;
      --text: "GT America", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    /* data-theme comes from the shared theme script; the media query only
       covers a page loaded without scripts. */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #0f0f0e;
      --ink: #ededea;
      --ink-soft: #cfccc4;
      --ink-muted: #a4a39d;
      --rule: #2a2a28;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --paper: #0f0f0e;
        --ink: #ededea;
        --ink-soft: #cfccc4;
        --ink-muted: #a4a39d;
        --rule: #2a2a28;
      }
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--text);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

    main {
      width: min(720px, calc(100% - 48px));
      margin: 0 auto;
      padding: 96px 0;
    }

    h1 {
      margin: 0;
      font-family: "GT America Expanded", var(--text);
      font-size: clamp(2rem, 4.5vw, 2.75rem);
      font-weight: 400;
      line-height: 1.15;
    }

    p { margin: 16px 0 32px; color: var(--ink-soft); }

    button {
      padding: 10px 16px;
      border: 1px solid var(--ink);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    @media (hover: hover) and (pointer: fine) {
      button:hover { background: var(--ink); color: var(--paper); }
    }

    @media (max-width: 600px) {
      main { width: calc(100% - 32px); padding: 64px 0; }
    }
  </style>
</head>
<body>
  <nav class="top-bar" aria-label="Tool navigation">
    <a class="back-link" href="../">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      All tools
    </a>
    <span class="tool-title">Nothing</span>
  </nav>
  <main>
    <h1>Nothing.</h1>
    <p id="status">It’s working.</p>
    <button type="button" id="again" aria-label="Do it again (does nothing)">Do it again</button>
  </main>
  <script>
    AtomicTheme.bind({ mode: 'dataset' });

    const statusText = document.getElementById('status');
    let resetTimer;

    document.getElementById('again').addEventListener('click', () => {
      clearTimeout(resetTimer);
      statusText.textContent = 'Done.';
      resetTimer = setTimeout(() => {
        statusText.textContent = 'It’s working.';
      }, 1400);
    });
  </script>
</body>
</html>
