<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://spidleweb.net" crossorigin>
  <title>Atomic Tools</title>
  <meta name="description" content="Small single-purpose web tools by Jason Spidle: a madlib maker, a Markdown and rich text converter, a text diff, and a Wordle checker.">
  <link rel="canonical" href="https://tools.spidleweb.net/">
  <script src="assets/atomic-theme.js"></script>
  <script>
    AtomicTheme.applyBeforePaint({ mode: 'dataset' });
  </script>
  <style>
    @font-face {
      font-family: "GT America";
      src: url("https://spidleweb.net/fonts/GT-America-Standard-Medium.woff2") format("woff2"),
           url("https://spidleweb.net/fonts/GT-America-Standard-Medium.woff") format("woff");
      font-display: swap;
      font-weight: 500;
    }

    *, *::before, *::after { box-sizing: border-box; }

    :root {
      color-scheme: light;
      --paper: #f5f4ef;
      --ink: #111111;
      --ink-muted: #66665f;
      --rule: #dddbd3;
      --text: "GT America", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --glyph: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --ease: cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* The theme script sets data-theme before paint (shared with the tools'
       toggles); the media query only covers a page loaded without scripts. */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #0f0f0e;
      --ink: #ededea;
      --ink-muted: #a4a39d;
      --rule: #2a2a28;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --paper: #0f0f0e;
        --ink: #ededea;
        --ink-muted: #a4a39d;
        --rule: #2a2a28;
      }
    }

    html, body { margin: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--text);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

    .shell {
      width: min(720px, calc(100% - 48px));
      margin: 0 auto;
      padding: 96px 0 96px;
    }

    .wordmark {
      margin: 0 0 96px;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .list { list-style: none; margin: 0; padding: 0; }

    .list--tools { border-top: 1px solid var(--rule); }

    .row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: baseline;
      gap: 24px;
      padding: 22px 0;
      border-bottom: 1px solid var(--rule);
    }

    /* The row's contents slide, never the link itself: moving the hovered box
       would pull it out from under a cursor near its left edge and flicker. */
    .row-name {
      font-size: 17px;
      font-weight: 500;
      transition: transform 140ms var(--ease);
    }

    .row-desc {
      font-size: 17px;
      font-weight: 500;
      color: var(--ink-muted);
      opacity: 0;
      transform: translateX(8px);
      transition: opacity 140ms var(--ease), transform 140ms var(--ease);
      pointer-events: none;
    }

    .row-arrow {
      font-family: var(--glyph);
      font-weight: 400;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
      transition: transform 140ms var(--ease);
    }

    /* Keyboard focus */
    .row:focus-visible .row-name {
      transform: translateX(12px);
      transition-duration: 200ms;
    }
    .row:focus-visible .row-desc {
      opacity: 1;
      transform: translateX(12px);
      transition-duration: 200ms;
    }
    .row:focus-visible .row-arrow {
      transform: translateX(16px);
      transition-duration: 200ms;
    }

    /* Pointer hover (skipped on touch) */
    @media (hover: hover) and (pointer: fine) {
      .row:hover .row-name {
        transform: translateX(12px);
        transition-duration: 200ms;
      }
      .row:hover .row-desc {
        opacity: 1;
        transform: translateX(12px);
        transition-duration: 200ms;
      }
      .row:hover .row-arrow {
        transform: translateX(16px);
        transition-duration: 200ms;
      }
    }

    .print-note { display: none; }

    @media print {
      body { background: white; color: black; }
      .print-note { display: block; margin-top: 48px; }
    }

    @media (max-width: 600px) {
      .shell { padding: 64px 0; width: calc(100% - 32px); }
      .wordmark { margin-bottom: 32px; }
      .row { grid-template-columns: minmax(0, 1fr) auto; }
      .row-desc { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <h1 class="wordmark">Atomic Tools</h1>

    <!-- Yes, all that CSS was for a list of links. -->
    <!-- One more, if you need it: nothing/ -->
    <ol class="list list--tools">
      <li>
        <a href="madlib-maker/" class="row">
          <span class="row-name">Madlib Maker</span>
          <span class="row-desc">Build and share custom madlibs</span>
          <span class="row-arrow" aria-hidden="true">›</span>
        </a>
      </li>
      <li>
        <a href="rich-text-markdown/" class="row">
          <span class="row-name">Markdown ↔ Rich Text</span>
          <span class="row-desc">Convert between rich text and Markdown</span>
          <span class="row-arrow" aria-hidden="true">›</span>
        </a>
      </li>
      <li>
        <a href="text-diff/" class="row">
          <span class="row-name">Text Diff</span>
          <span class="row-desc">Compare two blocks of prose or code</span>
          <span class="row-arrow" aria-hidden="true">›</span>
        </a>
      </li>
      <li>
        <a href="wordle-checker/" class="row">
          <span class="row-name">Wordle Checker</span>
          <span class="row-desc">Check if a five-letter word's been used</span>
          <span class="row-arrow" aria-hidden="true">›</span>
        </a>
      </li>
    </ol>
    <footer class="print-note">The links work better on screen.</footer>
  </main>
  <script>
    AtomicTheme.bind({ mode: 'dataset' });
  </script>
</body>
</html>
